<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pump Controller - Test & Calibration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; }
    body { background: #020617; color: #f8fafc; padding: 20px; }
    header { border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
    .box { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; }
    .btn { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-right: 8px; margin-bottom: 8px; }
    .btn-green { background: #16a34a; }
    .btn-red { background: #dc2626; }
    .terminal { background: #000; color: #4ade80; font-family: monospace; font-size: 13px; height: 260px; overflow-y: auto; padding: 12px; border-radius: 8px; border: 1px solid #1e293b; margin-top: 10px; }
    .input-row { display: flex; gap: 10px; margin-top: 10px; }
    input { background: #020617; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; flex: 1; font-family: monospace; }
  </style>
</head>
<body>
  <header>
    <div>
      <h2>Hardware Diagnostic &amp; Calibration Console</h2>
      <span style="font-size: 12px; color: #94a3b8;">Arduino Relay &amp; Flow Sensor Control</span>
    </div>
    <a href="/kiosk.html" style="color: #38bdf8; font-size: 13px; text-decoration: none;">&larr; Back to Kiosk</a>
  </header>

  <div class="grid">
    <div class="box">
      <h3 style="margin-bottom: 15px;">Manual Actuation</h3>
      <div style="margin-bottom: 20px;">
        <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px;">Relay 1: Main Dispense Pump</p>
        <button class="btn btn-green" onclick="relay(1, 'on')">Turn Pump ON</button>
        <button class="btn btn-red" onclick="relay(1, 'off')">Turn Pump OFF</button>
      </div>

      <div style="margin-bottom: 20px;">
        <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px;">Relay 2: Solenoid Valve</p>
        <button class="btn btn-green" onclick="relay(2, 'on')">Open Valve</button>
        <button class="btn btn-red" onclick="relay(2, 'off')">Close Valve</button>
      </div>

      <div>
        <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px;">Quick Test Sequences</p>
        <button class="btn" onclick="sendCmd('START:250')">Dispense 250mL</button>
        <button class="btn" onclick="sendCmd('START:500')">Dispense 500mL</button>
        <button class="btn btn-red" onclick="sendCmd('STOP')">Emergency Stop</button>
      </div>
    </div>

    <div class="box">
      <h3>Live Serial Terminal</h3>
      <div id="term" class="terminal">[SYSTEM] Diagnostic console ready.</div>
      <div class="input-row">
        <input id="cmdInput" type="text" placeholder="Command (e.g. STATUS, START:500, PING)..." onkeydown="if(event.key==='Enter') sendCustom()">
        <button class="btn" onclick="sendCustom()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const term = document.getElementById('term');

    function log(msg, color = '#4ade80') {
      const line = document.createElement('div');
      line.style.color = color;
      line.innerText = new Date().toLocaleTimeString() + ' ' + msg;
      term.appendChild(line);
      term.scrollTop = term.scrollHeight;
    }

    function relay(id, state) {
      log(`[TX] RELAY:${id}:${state.toUpperCase()}`, '#fbbf24');
      fetch(`/api/relay/${id}/${state}`, { method: 'POST' })
        .then(r => r.json())
        .then(d => log(`[RX] Relay ${id} set to ${state}`, '#38bdf8'))
        .catch(() => log(`[MOCK] Relay ${id} -> ${state.toUpperCase()}`));
    }

    function sendCmd(cmd) {
      log(`[TX] ${cmd}`, '#fbbf24');
      if (cmd.startsWith('START:')) {
        const ml = parseInt(cmd.split(':')[1]);
        fetch('/api/dispense/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ml })
        }).catch(() => {});
      } else if (cmd === 'STOP') {
        fetch('/api/dispense/stop', { method: 'POST' }).catch(() => {});
      }
    }

    function sendCustom() {
      const inp = document.getElementById('cmdInput');
      const val = inp.value.trim();
      if (!val) return;
      sendCmd(val);
      inp.value = '';
    }
  </script>
</body>
</html>
